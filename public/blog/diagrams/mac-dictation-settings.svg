<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1200" height="360" fill="#FFFFFF"/>
<text x="600" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#1D1D1F">Where to find Dictation settings on a Mac</text>
<g font-size="21" text-anchor="middle">
<rect x="40" y="110" width="250" height="100" rx="20" fill="#F5F5F7" stroke="#D2D2D7"/><text x="165" y="155" font-weight="700" fill="#1D1D1F">Apple menu</text><text x="165" y="185" font-size="17" fill="#6E6E73">top-left corner</text>
<rect x="330" y="110" width="250" height="100" rx="20" fill="#F5F5F7" stroke="#D2D2D7"/><text x="455" y="155" font-weight="700" fill="#1D1D1F">System Settings</text><text x="455" y="185" font-size="17" fill="#6E6E73">open it</text>
<rect x="620" y="110" width="250" height="100" rx="20" fill="#F5F5F7" stroke="#D2D2D7"/><text x="745" y="155" font-weight="700" fill="#1D1D1F">Keyboard</text><text x="745" y="185" font-size="17" fill="#6E6E73">in the sidebar</text>
<rect x="910" y="110" width="250" height="100" rx="20" fill="#EAF3FF" stroke="#0071E3"/><text x="1035" y="155" font-weight="700" fill="#0071E3">Dictation</text><text x="1035" y="185" font-size="17" fill="#3A3A3C">scroll down</text>
</g>
<g stroke="#86868B" stroke-width="3" fill="#86868B"><line x1="292" y1="160" x2="320" y2="160"/><polygon points="320,153 328,160 320,167"/><line x1="582" y1="160" x2="610" y2="160"/><polygon points="610,153 618,160 610,167"/><line x1="872" y1="160" x2="900" y2="160"/><polygon points="900,153 908,160 900,167"/></g>
<text x="600" y="275" text-anchor="middle" font-size="19" fill="#3A3A3C">Here you can: turn Dictation on · pick languages · choose the microphone · change the shortcut · turn auto-punctuation off</text>
</svg>
