<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1200" height="420" fill="#FFFFFF"/>
<text x="600" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#1D1D1F">Word error rate, by example</text>
<text x="60" y="120" font-size="19" fill="#6E6E73">What you said</text>
<text x="260" y="120" font-size="24" fill="#1D1D1F">please send the report to Priya today</text>
<text x="60" y="185" font-size="19" fill="#6E6E73">What it typed</text>
<text x="260" y="185" font-size="24" fill="#1D1D1F">please send <tspan fill="#DC2626" font-weight="700">a</tspan> report to <tspan fill="#DC2626" font-weight="700">Maria</tspan> <tspan fill="#EA580C" font-weight="700">uh</tspan></text>
<g font-size="19"><rect x="60" y="230" width="340" height="80" rx="16" fill="#FEF2F2"/><text x="80" y="265" font-weight="700" fill="#DC2626">2 substitutions</text><text x="80" y="292" fill="#3A3A3C">the → a, Priya → Maria</text>
<rect x="430" y="230" width="340" height="80" rx="16" fill="#FFF7ED"/><text x="450" y="265" font-weight="700" fill="#EA580C">1 deletion + 1 insertion</text><text x="450" y="292" fill="#3A3A3C">"today" lost, "uh" added</text>
<rect x="800" y="230" width="340" height="80" rx="16" fill="#EAF3FF"/><text x="820" y="265" font-weight="700" fill="#0071E3">WER = 4 ÷ 7 ≈ 57%</text><text x="820" y="292" fill="#3A3A3C">errors ÷ words you said</text></g>
<text x="600" y="370" text-anchor="middle" font-size="17" fill="#6E6E73">Good modern engines score roughly 2–8% on clean English benchmarks. Real-world audio is usually harder.</text>
</svg>
