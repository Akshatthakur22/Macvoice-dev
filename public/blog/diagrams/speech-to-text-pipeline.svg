<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1200" height="420" fill="#FFFFFF"/>
<text x="600" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#1D1D1F">How speech becomes text</text>
<g font-size="19" text-anchor="middle">
<rect x="30" y="130" width="190" height="130" rx="20" fill="#EAF3FF" stroke="#0071E3"/><text x="125" y="185" font-weight="700" fill="#0071E3">1. Microphone</text><text x="125" y="215" fill="#3A3A3C">Sound waves</text><text x="125" y="240" fill="#3A3A3C">→ audio samples</text>
<rect x="255" y="130" width="190" height="130" rx="20" fill="#F5F5F7" stroke="#D2D2D7"/><text x="350" y="185" font-weight="700" fill="#1D1D1F">2. Features</text><text x="350" y="215" fill="#3A3A3C">Audio sliced into</text><text x="350" y="240" fill="#3A3A3C">tiny frames</text>
<rect x="480" y="130" width="230" height="130" rx="20" fill="#ECFDF5" stroke="#059669"/><text x="595" y="185" font-weight="700" fill="#059669">3. Speech model</text><text x="595" y="215" fill="#3A3A3C">A neural network picks</text><text x="595" y="240" fill="#3A3A3C">the likeliest words</text>
<rect x="745" y="130" width="190" height="130" rx="20" fill="#F5F5F7" stroke="#D2D2D7"/><text x="840" y="185" font-weight="700" fill="#1D1D1F">4. Cleanup</text><text x="840" y="215" fill="#3A3A3C">Punctuation, caps,</text><text x="840" y="240" fill="#3A3A3C">remove "um"</text>
<rect x="970" y="130" width="200" height="130" rx="20" fill="#EAF3FF" stroke="#0071E3"/><text x="1070" y="185" font-weight="700" fill="#0071E3">5. Your app</text><text x="1070" y="215" fill="#3A3A3C">Text appears</text><text x="1070" y="240" fill="#3A3A3C">at the cursor</text>
</g>
<g stroke="#86868B" stroke-width="3" fill="#86868B"><line x1="222" y1="195" x2="248" y2="195"/><polygon points="248,188 256,195 248,202"/><line x1="447" y1="195" x2="473" y2="195"/><polygon points="473,188 481,195 473,202"/><line x1="712" y1="195" x2="738" y2="195"/><polygon points="738,188 746,195 738,202"/><line x1="937" y1="195" x2="963" y2="195"/><polygon points="963,188 971,195 963,202"/></g>
<text x="600" y="340" text-anchor="middle" font-size="18" fill="#6E6E73">Steps 2–3 run either on your device or on a company's servers. That single choice decides where your voice goes.</text>
</svg>
